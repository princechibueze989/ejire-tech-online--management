<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#071b3b">
	<title>Reset your password | Ejire Tech</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="auth.css">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../supabase-client.js"></script>
	<script src="auth.js" defer></script>
</head>
<body class="auth-page">
	<header class="auth-header"><a class="auth-brand" href="../index.html">Ejire Tech</a></header>
	<main class="auth-main">
		<section class="auth-panel" aria-labelledby="reset-title">
			<p class="auth-kicker">Account recovery</p>
			<h1 id="reset-title">Choose a new password</h1>
			<p class="auth-intro">Use at least 10 characters. A memorable passphrase is a good choice.</p>
			<form class="auth-form" id="reset-password-form">
				<div class="auth-field">
					<label for="new-password">New password</label>
					<div class="password-input"><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="10" required><button class="password-toggle" type="button" data-password-toggle aria-controls="new-password" aria-pressed="false">Show</button></div>
				</div>
				<div class="auth-field">
					<label for="confirm-new-password">Confirm new password</label>
					<div class="password-input"><input id="confirm-new-password" name="confirm-password" type="password" autocomplete="new-password" minlength="10" required><button class="password-toggle" type="button" data-password-toggle aria-controls="confirm-new-password" aria-pressed="false">Show</button></div>
				</div>
				<button class="auth-button" type="submit">Update password</button>
				<p class="auth-status" role="status" aria-live="polite"></p>
			</form>
			<p class="auth-switch"><a href="login.html">Return to log in</a></p>
		</section>
	</main>
	<footer class="auth-footer">Building Tech Community.</footer>
</body>
</html>
