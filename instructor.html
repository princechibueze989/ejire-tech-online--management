<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b3b">
  <meta name="description" content="Instructor workspace for Ejire Tech courses, learners, assignments, and attendance.">
  <title>Instructor Portal | Ejire Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/instructor.css">
  <script type="module" src="js/instructor-local.js"></script>
</head>
<body class="instructor-page">
  <header class="instructor-header">
    <a class="brand" href="index.html" aria-label="Ejire Tech home">
      <img class="brand-logo" src="ejire-tech-logo.svg" alt="Ejire Tech">
    </a>
    <div class="instructor-header-actions">
      <span class="local-mode-badge">Local demo</span>
      <a href="index.html">Visit website</a>
    </div>
  </header>

  <main class="instructor-main">
    <section class="instructor-app" id="instructor-app">
      <aside class="instructor-sidebar">
        <div class="instructor-profile">
          <div class="instructor-avatar" id="profile-avatar">ET</div>
          <div><strong id="profile-name">Instructor</strong><span>Instructor</span></div>
        </div>
        <nav class="instructor-nav" aria-label="Instructor navigation">
          <button type="button" data-view="dashboard" class="is-active">Overview</button>
          <button type="button" data-view="courses">My courses</button>
          <button type="button" data-view="students">My students</button>
          <button type="button" data-view="assignments">Assignments &amp; grading</button>
          <button type="button" data-view="quizzes">Quizzes</button>
          <button type="button" data-view="attendance">Attendance</button>
          <button type="button" data-view="messages">Messages <span id="unread-count" class="nav-count" hidden>0</span></button>
          <button type="button" data-view="notifications">Notifications <span id="notification-count" class="nav-count" hidden>0</span></button>
          <button type="button" data-view="profile">My profile</button>
        </nav>
        <p class="sidebar-note">Your workspace only shows courses and learners assigned to you.</p>
      </aside>
      <div class="instructor-content">
        <div class="instructor-alert instructor-alert--demo" role="note">Demo mode: changes are saved in this browser only. There is no real sign-in, sync, or backend access control.</div>
        <div class="instructor-alert" id="workspace-status" role="status" aria-live="polite" hidden></div>
        <div id="workspace-content"></div>
      </div>
    </section>
  </main>
  <footer class="instructor-footer">Ejire Tech · Instructor Portal</footer>
</body>
</html>
