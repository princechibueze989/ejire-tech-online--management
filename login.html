<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b3b">
  <title>Log in | Ejire Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header wrap auth-header">
    <a class="brand" href="index.html" aria-label="Ejire Tech home">
      <img class="brand-logo" src="ejire-tech-logo.svg" alt="Ejire Tech, Building Tech Community">
    </a>
    <a class="auth-header-link" href="register.html">New to Ejire Tech? Register</a>
  </header>
  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="login-title">
      <div class="auth-kicker">Welcome back</div>
      <h1 id="login-title">Log in to your account</h1>
      <p class="auth-intro">Continue learning and building with the Ejire Tech community.</p>
      <form class="auth-form" id="login-form">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button" type="submit">Log in</button>
        <p class="auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <footer class="auth-footer">Building Tech Community.</footer>
</body>
</html>
